<div class="container my-4" *ngIf="cartApi.cart$ | async as cart">
  <h3 class="mb-3">Your Cart</h3>

  <div *ngIf="cart.items.length; else empty">
    <div class="list-group mb-3">
      <div class="list-group-item cart-item" *ngFor="let it of cart.items">
     
        <img class="item-img rounded" [src]="it.product?.images?.[0]" alt="" width="64" height="64" />

       
        <div class="item-title">
          <div class="fw-semibold text-truncate">{{ it.product?.name }}</div>
          <small class="text-muted">₹{{ it.price }} each</small>
        </div>

       
        <div class="input-group qty-group">
          <button class="btn btn-outline-secondary btn-sm" (click)="dec(it.productId, it.quantity)">−</button>
          <input class="form-control form-control-sm text-center" [value]="it.quantity" readonly />
          <button class="btn btn-outline-secondary btn-sm" (click)="inc(it.productId, it.quantity)">+</button>
        </div>

      
        <div class="fw-bold item-line-total">
          ₹{{ it.quantity * it.price }}
        </div>

        <button class="btn btn-link text-danger p-0 item-remove" (click)="remove(it.productId)">
          <span class="d-none d-sm-inline">Remove</span>
          <span class="d-inline d-sm-none">✕</span>
        </button>
      </div>
    </div>


    <div class="cart-footer d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
      <button class="btn btn-outline-danger w-100 w-sm-auto" (click)="clear()">Clear Cart</button>
      <h4 class="m-0 text-sm-end w-100 w-sm-auto">Total: ₹{{ cart.totalAmount }}</h4>
       <a class="btn btn-primary" [routerLink]="['/checkout']">Place order</a>
    </div>
  </div>

  <ng-template #empty>
    <div class="alert alert-info">Your cart is empty.</div>
  </ng-template>
</div>
