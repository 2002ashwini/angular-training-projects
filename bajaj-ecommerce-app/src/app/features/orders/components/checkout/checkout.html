<div class="container my-4" style="max-width:720px">
  <h3>Checkout</h3>

  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <form (ngSubmit)="submit()">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full name</label>
        <input class="form-control" [(ngModel)]="model.shippingAddress.fullName" name="fullName" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Phone</label>
        <input class="form-control" [(ngModel)]="model.shippingAddress.phone" name="phone" required />
      </div>
      <div class="col-12">
        <label class="form-label">Address line 1</label>
        <input class="form-control" [(ngModel)]="model.shippingAddress.line1" name="line1" required />
      </div>
      <div class="col-12">
        <label class="form-label">Address line 2 (optional)</label>
        <input class="form-control" [(ngModel)]="model.shippingAddress.line2" name="line2" />
      </div>
      <div class="col-md-4">
        <label class="form-label">City</label>
        <input class="form-control" [(ngModel)]="model.shippingAddress.city" name="city" required />
      </div>
      <div class="col-md-4">
        <label class="form-label">State</label>
        <input class="form-control" [(ngModel)]="model.shippingAddress.state" name="state" required />
      </div>
      <div class="col-md-4">
        <label class="form-label">Postal code</label>
        <input class="form-control" [(ngModel)]="model.shippingAddress.postalCode" name="postalCode" required />
      </div>

      <div class="col-md-6">
        <label class="form-label">Payment</label>
        <select class="form-select" [(ngModel)]="model.paymentMethod" name="paymentMethod">
          <option value="COD">Cash on Delivery</option>
          <option value="ONLINE" disabled>Online (coming soon)</option>
        </select>
      </div>
    </div>

    <div class="d-flex justify-content-end gap-2 mt-3">
      <button class="btn btn-primary" [disabled]="placing" type="submit">Place Order</button>
    </div>
  </form>
</div>
